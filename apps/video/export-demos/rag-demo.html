<!doctype html>
<html data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>justice.rag.json — retrieval</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: oklch(0.985 0.004 70); --surface: oklch(1 0 0); --surface-sunken: oklch(0.965 0.005 70);
    --border: oklch(0.880 0.008 70); --fg: oklch(0.260 0.010 70); --fg-muted: oklch(0.555 0.010 70);
    --fg-strong: oklch(0.165 0.008 70); --accent: oklch(0.720 0.140 75); --accent-subtle: oklch(0.955 0.03 75);
    --font-sans: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  }
  html[data-theme="dark"] {
    --bg: oklch(0.165 0.008 70); --surface: oklch(0.215 0.010 70); --surface-sunken: oklch(0.190 0.009 70);
    --border: oklch(0.330 0.012 70); --fg: oklch(0.880 0.008 70); --fg-muted: oklch(0.625 0.012 70);
    --fg-strong: oklch(0.965 0.006 70); --accent: oklch(0.760 0.150 78); --accent-subtle: oklch(0.30 0.05 78);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); font-family: var(--font-sans); color: var(--fg);
         display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 40px; }
  .card { width: 720px; background: var(--surface); border: 1px solid var(--border);
          border-radius: 14px; padding: 22px; box-shadow: 0 8px 30px rgba(0,0,0,0.08); }
  .filechip { display: inline-flex; align-items: center; gap: 8px; font-family: var(--font-mono);
              font-size: 13px; color: var(--fg-muted); margin-bottom: 16px; }
  .filechip b { color: var(--fg); font-weight: 500; }
  .dot { width: 8px; height: 8px; border-radius: 9999px; background: var(--accent); }
  .search { display: flex; align-items: center; gap: 10px; border: 1px solid var(--border);
            border-radius: 10px; padding: 12px 14px; background: var(--surface-sunken); }
  .search svg { flex: none; color: var(--fg-muted); }
  .search .q { font-size: 17px; color: var(--fg-strong); font-weight: 500; }
  .arrow { margin: 14px 0 14px 6px; color: var(--fg-muted); font-size: 13px; font-family: var(--font-mono); }
  .answer { border: 1px solid var(--border); border-radius: 10px; padding: 16px; background: var(--surface); }
  .answer .meta { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
  .ts { font-family: var(--font-mono); font-size: 13px; font-weight: 500; color: var(--accent);
        background: var(--accent-subtle); border-radius: 6px; padding: 3px 9px; }
  .chunk { font-family: var(--font-mono); font-size: 12px; color: var(--fg-muted); }
  .answer .text { font-size: 16px; line-height: 1.55; color: var(--fg); }
  mark { background: var(--accent-subtle); color: var(--fg-strong); border-radius: 3px; padding: 0 2px; }
  .link { margin-top: 12px; font-family: var(--font-mono); font-size: 12px; color: var(--fg-muted); word-break: break-all; }
</style>
</head>
<body>
  <div class="card">
    <div class="filechip"><span class="dot"></span> <b>justice.rag.json</b> — 60 chunks, real export</div>
    <div class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <span class="q" id="q"></span>
    </div>
    <div class="arrow">↳ best-matching chunk, with its timestamp</div>
    <div class="answer" id="answer"></div>
  </div>
<script>
  const QUERY = 'the driver of a trolley car'
  function fmt(t) { const s = Math.floor(t); return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0') }
  function score(text, terms) {
    const low = text.toLowerCase();
    return terms.reduce((n, w) => n + (low.split(w).length - 1), 0);
  }
  function boot() {
    document.getElementById('q').textContent = QUERY;
    const rag = window.__RAG__;
    const chunks = Array.isArray(rag) ? rag : (rag && rag.chunks) || [];
    const terms = QUERY.toLowerCase().split(/\s+/).filter(w => w.length > 3);
    let best = null, bestScore = -1;
    for (const c of chunks) { const sc = score(c.text || '', terms); if (sc > bestScore) { bestScore = sc; best = c; } }
    const a = document.getElementById('answer');
    if (!best) { a.textContent = 'No match.'; window.__ready = true; return; }
    let html = best.text;
    for (const w of terms) html = html.replace(new RegExp('\\b(' + w + ')\\b', 'ig'), '<mark>$1</mark>');
    a.innerHTML =
      '<div class="meta"><span class="ts">▶ ' + fmt(best.start_time) + '</span>' +
      '<span class="chunk">chunk ' + best.chunk_index + ' of ' + (best.metadata?.total_chunks ?? chunks.length) + '</span></div>' +
      '<div class="text">' + html + '</div>' +
      '<div class="link">' + best.deep_link + '</div>';
    window.__ready = true;
  }
  boot();
</script>
</body>
</html>
