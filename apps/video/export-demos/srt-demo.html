<!doctype html>
<html data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>captions.srt — subtitles</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: oklch(0.985 0.004 70); --surface: oklch(1 0 0); --border: oklch(0.880 0.008 70);
    --fg: oklch(0.260 0.010 70); --fg-muted: oklch(0.555 0.010 70); --accent: oklch(0.720 0.140 75);
    --font-sans: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  }
  html[data-theme="dark"] {
    --bg: oklch(0.165 0.008 70); --surface: oklch(0.215 0.010 70); --border: oklch(0.330 0.012 70);
    --fg: oklch(0.880 0.008 70); --fg-muted: oklch(0.625 0.012 70); --accent: oklch(0.760 0.150 78);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); font-family: var(--font-sans);
         display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 40px; }
  .card { width: 760px; background: var(--surface); border: 1px solid var(--border);
          border-radius: 14px; padding: 18px; box-shadow: 0 8px 30px rgba(0,0,0,0.08); }
  .filechip { display: inline-flex; align-items: center; gap: 8px; font-family: var(--font-mono);
              font-size: 13px; color: var(--fg-muted); margin-bottom: 12px; }
  .filechip b { color: var(--fg); font-weight: 500; }
  .dot { width: 8px; height: 8px; border-radius: 9999px; background: var(--accent); }
  .player { position: relative; border-radius: 10px; overflow: hidden; background: #100f0c; aspect-ratio: 16/9; }
  video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .wave { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
          gap: 6px; opacity: 0.28; pointer-events: none; }
  .wave i { width: 5px; border-radius: 3px; background: #cbb89a; }
  .cap { position: absolute; left: 0; right: 0; bottom: 34px; display: flex; justify-content: center; padding: 0 24px; }
  .cap span { background: rgba(0,0,0,0.72); color: #fff; font-size: 22px; line-height: 1.35;
              padding: 6px 14px; border-radius: 6px; max-width: 90%; text-align: center; text-wrap: balance; }
  .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 26px; background: linear-gradient(transparent, rgba(0,0,0,0.55));
         display: flex; align-items: center; gap: 8px; padding: 0 12px; }
  .bar .play { color: #fff; font-size: 12px; }
  .bar .track { flex: 1; height: 3px; border-radius: 2px; background: rgba(255,255,255,0.3); position: relative; }
  .bar .track i { position: absolute; left: 0; top: 0; bottom: 0; width: 58%; background: var(--accent); border-radius: 2px; }
  .caption-note { margin-top: 12px; font-size: 13px; color: var(--fg-muted); }
</style>
</head>
<body>
  <div class="card">
    <div class="filechip"><span class="dot"></span> <b>captions.srt</b> — your transcript, as subtitles</div>
    <div class="player">
      <video id="v" src="./fixture/neutral-player.mp4" muted playsinline></video>
      <div class="wave" id="wave"></div>
      <div class="cap"><span id="cap"></span></div>
      <div class="bar"><span class="play">▶</span><span class="track"><i></i></span></div>
    </div>
    <div class="caption-note">Every line comes from the real <code>.srt</code> export — timecodes and text unchanged.</div>
  </div>
<script>
  // Decorative static waveform bars (heights are fixed, not random — deterministic capture).
  const heights = [18,30,46,62,40,54,72,48,34,58,80,52,38,64,44,28,50,70,42,60,34,56,74,46,30,52,66,40,24,48];
  const wave = document.getElementById('wave');
  heights.forEach(h => { const b = document.createElement('i'); b.style.height = h + '%'; wave.appendChild(b); });

  // Parse the REAL SRT (injected by the capture as window.__SRT__, or fetched when opened standalone).
  function parseSrt(txt) {
    return txt.replace(/\r/g, '').trim().split(/\n\n+/).map(block => {
      const lines = block.split('\n');
      const tc = lines[1] || '';
      const m = tc.match(/(\d\d):(\d\d):(\d\d),(\d\d\d)\s*-->\s*(\d\d):(\d\d):(\d\d),(\d\d\d)/);
      if (!m) return null;
      const s = +m[1]*3600 + +m[2]*60 + +m[3] + +m[4]/1000;
      const e = +m[5]*3600 + +m[6]*60 + +m[7] + +m[8]/1000;
      return { s, e, text: lines.slice(2).join(' ') };
    }).filter(Boolean);
  }

  async function boot() {
    let srt = window.__SRT__;
    if (!srt) { try { srt = await (await fetch('./fixture/justice.srt')).text(); } catch (e) {} }
    const cues = srt ? parseSrt(srt) : [];
    const v = document.getElementById('v'), cap = document.getElementById('cap');
    const render = (t) => {
      const cue = cues.find(c => t >= c.s && t < c.e);
      cap.textContent = cue ? cue.text : '';
    };
    v.addEventListener('timeupdate', () => render(v.currentTime));
    window.__seekTo = (t) => { v.currentTime = t; render(t); };
    render(0);
    window.__ready = true;
  }
  boot();
</script>
</body>
</html>
